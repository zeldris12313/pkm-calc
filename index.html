<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VGC Champion 傷害計算機</title>
  
  <!-- 引入官方核心 -->
  <script src="https://cdn.jsdelivr.net/npm/@smogon/calc/dist/calc.min.js"></script>

  <style>
    * { box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #eef2f5; margin: 0; padding: 15px; font-size: 13px; color: #222; }
    
    /* 頂部傷害橫幅 (仿截圖頂部) */
    .top-summary { background: #fff; border-radius: 8px; padding: 15px; margin-bottom: 15px; box-shadow: 0 2px 6px rgba(0,0,0,0.08); }
    .calc-result-title { font-size: 16px; font-weight: bold; color: #d32f2f; margin-bottom: 5px; }
    .calc-result-detail { font-size: 14px; color: #444; }

    /* 三欄式佈局 (左 - 中 - 右) */
    .calc-grid { display: grid; grid-template-columns: 1fr 280px 1fr; gap: 12px; }
    @media (max-width: 900px) { .calc-grid { grid-template-columns: 1fr; } }

    .panel { background: #fff; border-radius: 8px; overflow: hidden; box-shadow: 0 2px 6px rgba(0,0,0,0.06); }
    .panel-header { background: #2c3e50; color: #fff; padding: 10px 15px; font-weight: bold; font-size: 14px; display: flex; justify-content: space-between; align-items: center; }
    .panel-header.field-header { background: #34495e; text-align: center; justify-content: center; }
    .panel-body { padding: 12px; }

    .row { display: flex; align-items: center; margin-bottom: 8px; gap: 8px; }
    .row label { width: 70px; font-weight: bold; color: #555; }
    input, select { flex: 1; padding: 6px 8px; border: 1px solid #ccd1d9; border-radius: 4px; font-size: 13px; }
    
    /* 數值微調區 (HP, 物攻, 物防...) */
    .stat-row { display: grid; grid-template-columns: 50px 50px 1fr; gap: 6px; align-items: center; margin-bottom: 4px; font-size: 12px; }
    .stat-row input[type="number"] { width: 100%; padding: 4px; text-align: center; }

    /* 中間場地按鈕群 */
    .field-btn-group { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 10px; }
    .field-btn { flex: 1 1 45%; padding: 6px 2px; border: 1px solid #ccd1d9; background: #f8f9fa; border-radius: 4px; cursor: pointer; font-size: 12px; text-align: center; }
    .field-btn.active { background: #3498db; color: white; border-color: #2980b9; font-weight: bold; }

    /* 招式列表 */
    .moves-container { margin-top: 10px; border-top: 1px solid #eee; padding-top: 10px; }
    .move-item { display: flex; gap: 6px; margin-bottom: 6px; }
    .move-item select { flex: 1; }
    .move-btn { background: #e3350d; color: white; border: none; border-radius: 4px; padding: 6px 12px; cursor: pointer; font-weight: bold; }
    .move-btn:hover { background: #b82b09; }
  </style>
</head>
<body>

  <!-- 頂部即時計算結果看板 (完全依照截圖樣式) -->
  <div class="top-summary">
    <div id="result-desc" class="calc-result-title">請選擇寶可夢與招式進行計算</div>
    <div id="result-nums" class="calc-result-detail">傷害區間：--</div>
  </div>

  <!-- 核心三欄版面 -->
  <div class="calc-grid">
    
    <!-- 左欄：寶可夢 1 (攻擊方) -->
    <div class="panel">
      <div class="panel-header">
        <span>Pokémon 1 (攻擊方)</span>
      </div>
      <div class="panel-body">
        <div class="row">
          <label>寶可夢：</label>
          <input type="text" id="p1-search" placeholder="中/英文搜尋 (例如 振翼髮 / Flutter)" list="p1-list" oninput="onPokeChange(1)">
          <datalist id="p1-list"></datalist>
        </div>
        <div class="row">
          <label>性格：</label>
          <select id="p1-nature" onchange="calculateNow()">
            <option value="Adamant">固執 (+物攻 -特攻)</option>
            <option value="Jolly">爽朗 (+速度 -特攻)</option>
            <option value="Modest">內斂 (+特攻 -物攻)</option>
            <option value="Timid">膽小 (+速度 -物攻)</option>
            <option value="Brave">勇敢 (+物攻 -速度)</option>
            <option value="Quiet">冷靜 (+特攻 -速度)</option>
            <option value="Hardy">認真 (無修正)</option>
          </select>
        </div>
        <div class="row">
          <label>攜帶道具：</label>
          <select id="p1-item" onchange="calculateNow()">
            <option value="">(無)</option>
            <option value="Booster Energy">驅勁能量 (Booster Energy)</option>
            <option value="Choice Band">講究頭帶 (Choice Band)</option>
            <option value="Choice Specs">講究眼鏡 (Choice Specs)</option>
            <option value="Life Orb">生命寶珠 (Life Orb)</option>
            <option value="Focus Sash">氣勢披帶 (Focus Sash)</option>
          </select>
        </div>

        <div style="font-weight:bold; margin: 10px 0 5px;">努力值 (EVs)：</div>
        <div class="stat-row"><span>HP</span><input type="number" id="p1-ev-hp" value="0" min="0" max="252" step="4" onchange="calculateNow()"></div>
        <div class="stat-row"><span>物攻</span><input type="number" id="p1-ev-atk" value="252" min="0" max="252" step="4" onchange="calculateNow()"></div>
        <div class="stat-row"><span>物防</span><input type="number" id="p1-ev-def" value="0" min="0" max="252" step="4" onchange="calculateNow()"></div>
        <div class="stat-row"><span>特攻</span><input type="number" id="p1-ev-spa" value="0" min="0" max="252" step="4" onchange="calculateNow()"></div>
        <div class="stat-row"><span>特防</span><input type="number" id="p1-ev-spd" value="0" min="0" max="252" step="4" onchange="calculateNow()"></div>
        <div class="stat-row"><span>速度</span><input type="number" id="p1-ev-spe" value="252" min="0" max="252" step="4" onchange="calculateNow()"></div>

        <!-- 4 個招式 -->
        <div class="moves-container">
          <div style="font-weight:bold; margin-bottom:5px;">使用招式：</div>
          <div class="row">
            <select id="p1-move" onchange="calculateNow()"></select>
          </div>
        </div>
      </div>
    </div>

    <!-- 中欄：場地環境 (Field) -->
    <div class="panel">
      <div class="panel-header field-header">
        <span>對戰場地 (Field)</span>
      </div>
      <div class="panel-body">
        <label>對戰模式：</label>
        <div class="field-btn-group">
          <div class="field-btn active" id="mode-doubles" onclick="setMode('doubles')">雙打 (Doubles)</div>
          <div class="field-btn" id="mode-singles" onclick="setMode('singles')">單打 (Singles)</div>
        </div>

        <label>天氣環境：</label>
        <div class="field-btn-group">
          <div class="field-btn active" id="weather-none" onclick="setWeather('None')">無</div>
          <div class="field-btn" id="weather-sun" onclick="setWeather('Sun')">大晴天</div>
          <div class="field-btn" id="weather-rain" onclick="setWeather('Rain')">下雨</div>
          <div class="field-btn" id="weather-sand" onclick="setWeather('Sand')">沙暴</div>
          <div class="field-btn" id="weather-snow" onclick="setWeather('Snow')">雪天</div>
        </div>

        <label>場地狀態：</label>
        <div class="field-btn-group">
          <div class="field-btn active" id="terrain-none" onclick="setTerrain('None')">無</div>
          <div class="field-btn" id="terrain-electric" onclick="setTerrain('Electric')">電氣</div>
          <div class="field-btn" id="terrain-grassy" onclick="setTerrain('青草')">青草</div>
          <div class="field-btn" id="terrain-psychic" onclick="setTerrain('精神')">精神</div>
        </div>
      </div>
    </div>

    <!-- 右欄：寶可夢 2 (防守方) -->
    <div class="panel">
      <div class="panel-header">
        <span>Pokémon 2 (防守方)</span>
      </div>
      <div class="panel-body">
        <div class="row">
          <label>寶可夢：</label>
          <input type="text" id="p2-search" placeholder="中/英文搜尋 (例如 班基拉 / Tyranitar)" list="p2-list" oninput="onPokeChange(2)">
          <datalist id="p2-list"></datalist>
        </div>
        <div class="row">
          <label>性格：</label>
          <select id="p2-nature" onchange="calculateNow()">
            <option value="Hardy">認真 (無修正)</option>
            <option value="Impish">淘氣 (+物防 -特攻)</option>
            <option value="Careful">慎重 (+特防 -特攻)</option>
            <option value="Bold">溫和 (+物防 -物攻)</option>
            <option value="Calm">溫燥 (+特防 -物攻)</option>
          </select>
        </div>
        <div class="row">
          <label>攜帶道具：</label>
          <select id="p2-item" onchange="calculateNow()">
            <option value="">(無)</option>
            <option value="Assault Vest">突擊背心 (Assault Vest)</option>
            <option value="Sitrus Berry">文柚果 (Sitrus Berry)</option>
            <option value="Leftovers">吃剩的東西 (Leftovers)</option>
          </select>
        </div>

        <div style="font-weight:bold; margin: 10px 0 5px;">努力值 (EVs)：</div>
        <div class="stat-row"><span>HP</span><input type="number" id="p2-ev-hp" value="252" min="0" max="252" step="4" onchange="calculateNow()"></div>
        <div class="stat-row"><span>物攻</span><input type="number" id="p2-ev-atk" value="0" min="0" max="252" step="4" onchange="calculateNow()"></div>
        <div class="stat-row"><span>物防</span><input type="number" id="p2-ev-def" value="4" min="0" max="252" step="4" onchange="calculateNow()"></div>
        <div class="stat-row"><span>特攻</span><input type="number" id="p2-ev-spa" value="0" min="0" max="252" step="4" onchange="calculateNow()"></div>
        <div class="stat-row"><span>特防</span><input type="number" id="p2-ev-spd" value="0" min="0" max="252" step="4" onchange="calculateNow()"></div>
        <div class="stat-row"><span>速度</span><input type="number" id="p2-ev-spe" value="0" min="0" max="252" step="4" onchange="calculateNow()"></div>
      </div>
    </div>

  </div>

<script>
  // 招式中英名單
  const MOVES = [
    { zh: "月亮之力", en: "Moonblast" },
    { zh: "暗影球", en: "Shadow Ball" },
    { zh: "尖石攻擊", en: "Stone Edge" },
    { zh: "近身戰", en: "Close Combat" },
    { zh: "水流連打", en: "Surging Strikes" },
    { zh: "閃焰衝鋒", en: "Flare Blitz" },
    { zh: "地震", en: "Earthquake" },
    { zh: "棘藤棒", en: "Ivy Cudgel" },
    { zh: "木槌", en: "Wood Hammer" }
  ];

  let currentPool = [];
  let currentField = { gameType: 'doubles', weather: 'None', terrain: 'None' };

  // 初始化名單
  async function init() {
    try {
      const res = await fetch('champions.json');
      currentPool = await res.json();
    } catch {
      // 萬一 champions.json 載入失敗的預備資料
      currentPool = [
        { id: "Flutter Mane", name: "振翼髮" },
        { id: "Tyranitar", name: "班基拉" },
        { id: "Iron Hands", name: "鐵臂膀" },
        { id: "Urshifu-Rapid-Strike", name: "連擊流武道熊師" }
      ];
    }

    const p1List = document.getElementById("p1-list");
    const p2List = document.getElementById("p2-list");
    currentPool.forEach(p => {
      p1List.innerHTML += `<option value="${p.name}">${p.id}</option>`;
      p2List.innerHTML += `<option value="${p.name}">${p.id}</option>`;
    });

    // 填入招式
    const moveSelect = document.getElementById("p1-move");
    MOVES.forEach(m => {
      moveSelect.innerHTML += `<option value="${m.en}">${m.zh} (${m.en})</option>`;
    });

    // 預設攻擊方與防守方
    document.getElementById("p1-search").value = currentPool[0].name;
    document.getElementById("p2-search").value = currentPool[1].name;

    calculateNow();
  }

  // 找尋對應的英文 ID (支援輸入中文或英文)
  function getPokeId(val) {
    const found = currentPool.find(p => p.name.toLowerCase() === val.toLowerCase() || p.id.toLowerCase() === val.toLowerCase());
    return found ? found.id : val;
  }

  function onPokeChange(side) {
    calculateNow();
  }

  function setMode(mode) {
    currentField.gameType = mode;
    document.getElementById("mode-doubles").className = mode === 'doubles' ? 'field-btn active' : 'field-btn';
    document.getElementById("mode-singles").className = mode === 'singles' ? 'field-btn active' : 'field-btn';
    calculateNow();
  }

  function setWeather(w) {
    currentField.weather = w;
    ['None', 'Sun', 'Rain', 'Sand', 'Snow'].forEach(name => {
      const el = document.getElementById('weather-' + name.toLowerCase());
      if (el) el.className = name === w ? 'field-btn active' : 'field-btn';
    });
    calculateNow();
  }

  function setTerrain(t) {
    currentField.terrain = t;
    ['None', 'Electric', 'Grassy', 'Psychic'].forEach(name => {
      const el = document.getElementById('terrain-' + name.toLowerCase());
      if (el) el.className = name === t ? 'field-btn active' : 'field-btn';
    });
    calculateNow();
  }

  // 執行即時計算
  function calculateNow() {
    if (!window.calc) return;
    const calc = window.calc;
    const gen = calc.Generations.get(9);

    const p1Name = getPokeId(document.getElementById("p1-search").value);
    const p2Name = getPokeId(document.getElementById("p2-search").value);
    const moveName = document.getElementById("p1-move").value;

    try {
      const p1 = new calc.Pokemon(gen, p1Name, {
        nature: document.getElementById("p1-nature").value,
        item: document.getElementById("p1-item").value,
        evs: {
          hp: parseInt(document.getElementById("p1-ev-hp").value) || 0,
          atk: parseInt(document.getElementById("p1-ev-atk").value) || 0,
          def: parseInt(document.getElementById("p1-ev-def").value) || 0,
          spa: parseInt(document.getElementById("p1-ev-spa").value) || 0,
          spd: parseInt(document.getElementById("p1-ev-spd").value) || 0,
          spe: parseInt(document.getElementById("p1-ev-spe").value) || 0
        }
      });

      const p2 = new calc.Pokemon(gen, p2Name, {
        nature: document.getElementById("p2-nature").value,
        item: document.getElementById("p2-item").value,
        evs: {
          hp: parseInt(document.getElementById("p2-ev-hp").value) || 0,
          atk: parseInt(document.getElementById("p2-ev-atk").value) || 0,
          def: parseInt(document.getElementById("p2-ev-def").value) || 0,
          spa: parseInt(document.getElementById("p2-ev-spa").value) || 0,
          spd: parseInt(document.getElementById("p2-ev-spd").value) || 0,
          spe: parseInt(document.getElementById("p2-ev-spe").value) || 0
        }
      });

      const move = new calc.Move(gen, moveName);
      const field = new calc.Field({
        gameType: currentField.gameType === 'doubles' ? 'Doubles' : 'Singles',
        weather: currentField.weather !== 'None' ? currentField.weather : undefined,
        terrain: currentField.terrain !== 'None' ? currentField.terrain : undefined
      });

      const result = calc.calculate(gen, p1, p2, move, field);

      // 提取傷害與百分比
      const dmg = result.damage;
      const minDmg = Array.isArray(dmg) ? dmg[0] : dmg;
      const maxDmg = Array.isArray(dmg) ? dmg[dmg.length - 1] : dmg;
      const defenderHp = p2.rawStats.hp;
      const minPct = ((minDmg / defenderHp) * 100).toFixed(1);
      const maxPct = ((maxDmg / defenderHp) * 100).toFixed(1);

      document.getElementById("result-desc").innerText = result.desc();
      document.getElementById("result-nums").innerText = `傷害數值：${minDmg} ~ ${maxDmg} (${minPct}% - ${maxPct}%) | 對手總 HP：${defenderHp}`;

    } catch (err) {
      document.getElementById("result-desc").innerText = "無法計算（請確認寶可夢或招式名稱正確）";
      document.getElementById("result-nums").innerText = err.message;
    }
  }

  window.onload = init;
</script>
</body>
</html>
