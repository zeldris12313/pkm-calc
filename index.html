<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VGC Champions 傷害計算機</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Microsoft JhengHei", sans-serif; background: #eef2f5; margin: 0; padding: 12px; font-size: 13px; color: #222; }
    
    /* 頂部即時判定與傷害橫幅 */
    .top-summary { background: #fff; border-radius: 8px; padding: 16px; margin-bottom: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); border-left: 6px solid #d32f2f; }
    .ko-badge { display: inline-block; padding: 5px 12px; border-radius: 20px; font-weight: bold; font-size: 14px; margin-bottom: 8px; }
    .ko-guaranteed { background: #ffebee; color: #c62828; border: 1px solid #ef9a9a; }
    .ko-chance { background: #fff8e1; color: #f57f17; border: 1px solid #ffe082; }
    .ko-safe { background: #e8f5e9; color: #2e7d32; border: 1px solid #a5d6a7; }
    .calc-result-title { font-size: 15px; font-weight: bold; color: #111; line-height: 1.4; }
    .calc-result-detail { font-size: 13px; color: #555; margin-top: 4px; }

    /* 三欄佈局 */
    .calc-grid { display: grid; grid-template-columns: 1fr 270px 1fr; gap: 12px; }
    @media (max-width: 980px) { .calc-grid { grid-template-columns: 1fr; } }

    .panel { background: #fff; border-radius: 8px; overflow: hidden; box-shadow: 0 2px 6px rgba(0,0,0,0.06); }
    .panel-header { background: #2c3e50; color: #fff; padding: 10px 14px; font-weight: bold; font-size: 14px; display: flex; justify-content: space-between; align-items: center; }
    .panel-body { padding: 12px; }

    .row { display: flex; align-items: center; margin-bottom: 8px; gap: 8px; }
    .row label { width: 75px; font-weight: bold; color: #444; flex-shrink: 0; }
    input, select { flex: 1; padding: 6px 8px; border: 1px solid #ccd1d9; border-radius: 4px; font-size: 13px; }

    /* 屬性膠囊 */
    .type-badge { display: inline-flex; align-items: center; justify-content: center; padding: 3px 12px; border-radius: 12px; color: white; font-weight: bold; font-size: 12px; text-shadow: 0 1px 2px rgba(0,0,0,0.3); margin-left: 4px; }
    .type-一般 { background: #9fa19f; } .type-火 { background: #e62829; } .type-水 { background: #2980ef; }
    .type-電 { background: #fac000; color: #222; text-shadow: none; } .type-草 { background: #3fa129; }
    .type-冰 { background: #3dcef3; } .type-格鬥 { background: #ff8000; } .type-毒 { background: #9141cb; }
    .type-地面 { background: #915121; } .type-飛行 { background: #81b9ef; } .type-超能力 { background: #ef4179; }
    .type-蟲 { background: #91a119; } .type-岩石 { background: #afa981; } .type-幽靈 { background: #704170; }
    .type-龍 { background: #5060e1; } .type-惡 { background: #50413f; } .type-鋼 { background: #60a1b8; }
    .type-妖精 { background: #ef70ef; }

    /* 種族值與能力表格 */
    .bs-table { width: 100%; border-collapse: collapse; margin-top: 8px; font-size: 12px; }
    .bs-table th, .bs-table td { padding: 4px 6px; text-align: left; }
    .bs-table th { background: #f0f2f5; font-size: 11px; }
    .bar-bg { width: 100%; background: #e9ecef; height: 12px; border-radius: 6px; overflow: hidden; }
    .bar-fill { height: 100%; border-radius: 6px; }
    .bar-hp { background: #78c850; } .bar-atk { background: #f08030; } .bar-def { background: #e09040; }
    .bar-spa { background: #58c8e0; } .bar-spd { background: #5890e0; } .bar-spe { background: #a040a0; }

    /* EV 輸入網格 */
    .ev-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin: 8px 0; background: #fafbfc; padding: 8px; border-radius: 6px; border: 1px solid #eee; }
    .ev-item { display: flex; align-items: center; gap: 4px; font-size: 11px; }
    .ev-item span { width: 28px; font-weight: bold; }
    .ev-item input { width: 45px; padding: 2px 4px; text-align: center; }

    /* 4招式選擇區 */
    .moves-card { margin-top: 10px; border-top: 1px solid #eee; padding-top: 10px; }
    .move-row { display: flex; align-items: center; gap: 6px; margin-bottom: 6px; }
    .move-row input[type="radio"] { width: auto; margin: 0; cursor: pointer; }
    .move-row select { font-size: 12px; padding: 4px; }

    /* 場地按鈕 */
    .field-btn-group { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 6px; }
    .field-btn { flex: 1 1 45%; padding: 6px 4px; border: 1px solid #ccd1d9; background: #f8f9fa; border-radius: 4px; cursor: pointer; font-size: 11px; text-align: center; }
    .field-btn.active { background: #2980b9; color: white; border-color: #2471a3; font-weight: bold; }
    .field-note { font-size: 11px; color: #0277bd; background: #e1f5fe; padding: 6px; border-radius: 4px; margin-bottom: 10px; line-height: 1.3; }
  </style>
</head>
<body>

  <!-- 頂部即時判定與傷害橫幅 -->
  <div class="top-summary">
    <div id="ko-status" class="ko-badge ko-safe">計算中...</div>
    <div id="result-desc" class="calc-result-title">載入中...</div>
    <div id="result-nums" class="calc-result-detail">--</div>
  </div>

  <div class="calc-grid">
    
    <!-- 左欄：攻擊方 (Pokémon 1) -->
    <div class="panel">
      <div class="panel-header">
        <span>Pokémon 1 (攻擊方)</span>
        <div id="p1-types"></div>
      </div>
      <div class="panel-body">
        <div class="row">
          <label>寶可夢：</label>
          <input type="text" id="p1-search" placeholder="輸入中文或英文..." list="poke-list" oninput="onPokeInput(1)">
        </div>

        <div class="row" id="p1-forme-row" style="display:none;">
          <label>形態/進化：</label>
          <select id="p1-forme" onchange="calcNow()"></select>
        </div>

        <div class="row">
          <label>性格：</label>
          <select id="p1-nature" onchange="calcNow()"></select>
        </div>

        <div class="row">
          <label>道具：</label>
          <select id="p1-item" onchange="calcNow()"></select>
        </div>

        <!-- 努力值 EVs -->
        <label style="font-weight:bold;">努力值 (EVs)：</label>
        <div class="ev-grid">
          <div class="ev-item"><span>HP</span><input type="number" id="p1-ev-hp" value="0" min="0" max="252" step="4" onchange="calcNow()"></div>
          <div class="ev-item"><span>物攻</span><input type="number" id="p1-ev-atk" value="252" min="0" max="252" step="4" onchange="calcNow()"></div>
          <div class="ev-item"><span>物防</span><input type="number" id="p1-ev-def" value="0" min="0" max="252" step="4" onchange="calcNow()"></div>
          <div class="ev-item"><span>特攻</span><input type="number" id="p1-ev-spa" value="0" min="0" max="252" step="4" onchange="calcNow()"></div>
          <div class="ev-item"><span>特防</span><input type="number" id="p1-ev-spd" value="0" min="0" max="252" step="4" onchange="calcNow()"></div>
          <div class="ev-item"><span>速度</span><input type="number" id="p1-ev-spe" value="252" min="0" max="252" step="4" onchange="calcNow()"></div>
        </div>

        <!-- 種族值表格 -->
        <table class="bs-table" id="p1-bstable">
          <thead>
            <tr><th>項目</th><th>種族值</th><th style="width:90px;">圖表</th><th>50等實數值</th></tr>
          </thead>
          <tbody></tbody>
        </table>

        <!-- 4 招可學招式選單 -->
        <div class="moves-card">
          <label style="font-weight:bold; display:block; margin-bottom:6px;">專屬配招 (最多4招，選定計傷)：</label>
          <div class="move-row">
            <input type="radio" name="active-move" value="0" checked onchange="calcNow()">
            <select id="p1-move-0" onchange="calcNow()"></select>
          </div>
          <div class="move-row">
            <input type="radio" name="active-move" value="1" onchange="calcNow()">
            <select id="p1-move-1" onchange="calcNow()"></select>
          </div>
          <div class="move-row">
            <input type="radio" name="active-move" value="2" onchange="calcNow()">
            <select id="p1-move-2" onchange="calcNow()"></select>
          </div>
          <div class="move-row">
            <input type="radio" name="active-move" value="3" onchange="calcNow()">
            <select id="p1-move-3" onchange="calcNow()"></select>
          </div>
        </div>
      </div>
    </div>

    <!-- 中欄：對戰環境 (Field) -->
    <div class="panel">
      <div class="panel-header" style="justify-content:center; background:#34495e;">
        <span>對戰環境 (Field)</span>
      </div>
      <div class="panel-body">
        <label>比賽模式：</label>
        <div class="field-btn-group">
          <div class="field-btn active" id="mode-doubles" onclick="setMode('doubles')">雙打 (Doubles)</div>
          <div class="field-btn" id="mode-singles" onclick="setMode('singles')">單打 (Singles)</div>
        </div>
        <div id="mode-desc" class="field-note">雙打：多目標招式 (如岩崩、熱風、地震) 傷害分散為 75%。</div>

        <label>天氣環境：</label>
        <div class="field-btn-group">
          <div class="field-btn active" id="w-none" onclick="setWeather('None')">無天氣</div>
          <div class="field-btn" id="w-sun" onclick="setWeather('Sun')">大晴天</div>
          <div class="field-btn" id="w-rain" onclick="setWeather('Rain')">下雨</div>
          <div class="field-btn" id="w-sand" onclick="setWeather('Sand')">沙暴</div>
          <div class="field-btn" id="w-snow" onclick="setWeather('Snow')">雪天</div>
        </div>
        <div id="weather-desc" class="field-note">一般常態環境無天氣加成。</div>

        <label>場地狀態：</label>
        <div class="field-btn-group">
          <div class="field-btn active" id="t-none" onclick="setTerrain('None')">無場地</div>
          <div class="field-btn" id="t-electric" onclick="setTerrain('Electric')">電氣場地</div>
          <div class="field-btn" id="t-grassy" onclick="setTerrain('Grassy')">青草場地</div>
          <div class="field-btn" id="t-psychic" onclick="setTerrain('Psychic')">精神場地</div>
          <div class="field-btn" id="t-misty" onclick="setTerrain('Misty')">薄霧場地</div>
        </div>
        <div id="terrain-desc" class="field-note">地面上的寶可夢無特定場地效果加成。</div>
      </div>
    </div>

    <!-- 右欄：防守方 (Pokémon 2) -->
    <div class="panel">
      <div class="panel-header">
        <span>Pokémon 2 (防守方)</span>
        <div id="p2-types"></div>
      </div>
      <div class="panel-body">
        <div class="row">
          <label>寶可夢：</label>
          <input type="text" id="p2-search" placeholder="輸入中文或英文..." list="poke-list" oninput="onPokeInput(2)">
        </div>

        <div class="row" id="p2-forme-row" style="display:none;">
          <label>形態/進化：</label>
          <select id="p2-forme" onchange="calcNow()"></select>
        </div>

        <div class="row">
          <label>性格：</label>
          <select id="p2-nature" onchange="calcNow()"></select>
        </div>

        <div class="row">
          <label>道具：</label>
          <select id="p2-item" onchange="calcNow()"></select>
        </div>

        <!-- 努力值 EVs -->
        <label style="font-weight:bold;">努力值 (EVs)：</label>
        <div class="ev-grid">
          <div class="ev-item"><span>HP</span><input type="number" id="p2-ev-hp" value="252" min="0" max="252" step="4" onchange="calcNow()"></div>
          <div class="ev-item"><span>物攻</span><input type="number" id="p2-ev-atk" value="0" min="0" max="252" step="4" onchange="calcNow()"></div>
          <div class="ev-item"><span>物防</span><input type="number" id="p2-ev-def" value="4" min="0" max="252" step="4" onchange="calcNow()"></div>
          <div class="ev-item"><span>特攻</span><input type="number" id="p2-ev-spa" value="0" min="0" max="252" step="4" onchange="calcNow()"></div>
          <div class="ev-item"><span>特防</span><input type="number" id="p2-ev-spd" value="0" min="0" max="252" step="4" onchange="calcNow()"></div>
          <div class="ev-item"><span>速度</span><input type="number" id="p2-ev-spe" value="0" min="0" max="252" step="4" onchange="calcNow()"></div>
        </div>

        <!-- 種族值表格 -->
        <table class="bs-table" id="p2-bstable">
          <thead>
            <tr><th>項目</th><th>種族值</th><th style="width:90px;">圖表</th><th>50等實數值</th></tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </div>

  </div>

  <datalist id="poke-list"></datalist>

  // 初始化選單
  function init() {
    // 1. 單行中英 datalist (例如: 班基拉 (Tyranitar))
    const dataList = document.getElementById("poke-list");
    dataList.innerHTML = "";
    POKEMON_DB.forEach(p => {
      dataList.innerHTML += `<option value="${p.name} (${p.en})"></option>`;
    });

    // 2. 填入 25 種性格
    const n1 = document.getElementById("p1-nature");
    const n2 = document.getElementById("p2-nature");
    NATURES.forEach(n => {
      let desc = n.name;
      if (n.plus) {
        const trans = { atk: "物攻", def: "物防", spa: "特攻", spd: "特防", spe: "速度" };
        desc += ` (+${trans[n.plus]} -${trans[n.minus]})`;
      } else {
        desc += " (無修正)";
      }
      n1.innerHTML += `<option value="${n.id}">${desc}</option>`;
      n2.innerHTML += `<option value="${n.id}">${desc}</option>`;
    });
    n1.value = "Adamant"; // 固執
    n2.value = "Hardy";   // 認真

    // 3. 填入主流道具
    const i1 = document.getElementById("p1-item");
    const i2 = document.getElementById("p2-item");
    ITEMS.forEach(it => {
      i1.innerHTML += `<option value="${it.id}">${it.name}</option>`;
      i2.innerHTML += `<option value="${it.id}">${it.name}</option>`;
    });

    document.getElementById("p1-search").value = "班基拉 (Tyranitar)";
    document.getElementById("p2-search").value = "振翼髮 (Flutter Mane)";

    onPokeInput(1);
    onPokeInput(2);
    calcNow();
  }

  // 模糊中英匹配解析
  function getPokeObj(val) {
    if (!val) return POKEMON_DB[0];
    const clean = val.trim().toLowerCase();
    const found = POKEMON_DB.find(p => 
      p.name.toLowerCase().includes(clean) || 
      p.en.toLowerCase().includes(clean) || 
      clean.includes(p.name.toLowerCase()) || 
      clean.includes(p.en.toLowerCase())
    );
    return found || POKEMON_DB[0];
  }

  // 更新精靈輸入與專屬招式池
  function onPokeInput(side) {
    const val = document.getElementById(`p${side}-search`).value;
    const p = getPokeObj(val);
    const formeRow = document.getElementById(`p${side}-forme-row`);
    const formeSel = document.getElementById(`p${side}-forme`);

    if (p.megas && p.megas.length > 0) {
      formeRow.style.display = "flex";
      formeSel.innerHTML = `<option value="-1">一般形態</option>`;
      p.megas.forEach((m, idx) => {
        formeSel.innerHTML += `<option value="${idx}">${m.name}</option>`;
      });
    } else {
      formeRow.style.display = "none";
    }

    if (side === 1) {
      updateMoveSlots(p);
    }

    calcNow();
  }

  // 更新專屬招式並提示「STAB 屬修」
  function updateMoveSlots(poke) {
    const activeTypes = getCurrentStats(1).types;
    for (let slot = 0; slot < 4; slot++) {
      const sel = document.getElementById(`p1-move-${slot}`);
      sel.innerHTML = "";
      poke.moves.forEach((m, mIdx) => {
        const isStab = activeTypes.includes(m.type);
        const stabTag = isStab ? " [STAB 屬修 x1.5]" : "";
        sel.innerHTML += `<option value="${mIdx}">${m.name} (${m.en}) - [${m.type}] 威力:${m.bp}${stabTag}</option>`;
      });
      // 預設按順序排 4 招
      if (poke.moves[slot]) sel.value = slot;
    }
  }

  function getCurrentStats(side) {
    const val = document.getElementById(`p${side}-search`).value;
    const baseP = getPokeObj(val);
    const formeRow = document.getElementById(`p${side}-forme-row`);
    const formeIdx = parseInt(document.getElementById(`p${side}-forme`).value);

    if (formeRow.style.display !== "none" && formeIdx >= 0) {
      const mega = baseP.megas[formeIdx];
      return { name: mega.name, types: mega.types, bs: mega.bs, moves: baseP.moves };
    }
    return { name: baseP.name, types: baseP.types, bs: baseP.bs, moves: baseP.moves };
  }

  function calc50Stat(statKey, base, ev, natureMult) {
    const iv = 31;
    if (statKey === "hp") {
      return Math.floor(((base * 2 + iv + Math.floor(ev / 4)) * 50) / 100) + 60;
    } else {
      const raw = Math.floor(((base * 2 + iv + Math.floor(ev / 4)) * 50) / 100) + 5;
      return Math.floor(raw * natureMult);
    }
  }

  function getNatureMult(natureId, statKey) {
    const n = NATURES.find(item => item.id === natureId);
    if (!n || !n.plus) return 1.0;
    if (n.plus === statKey) return 1.1;
    if (n.minus === statKey) return 0.9;
    return 1.0;
  }

  // 渲染種族值與50等能力值 (含沙暴特防判定)
  function renderStats(side, pokeData) {
    const typesDiv = document.getElementById(`p${side}-types`);
    typesDiv.innerHTML = "";
    pokeData.types.forEach(t => {
      typesDiv.innerHTML += `<span class="type-badge type-${t}">${t}</span>`;
    });

    const nature = document.getElementById(`p${side}-nature`).value;

    const evs = {
      hp: parseInt(document.getElementById(`p${side}-ev-hp`).value) || 0,
      atk: parseInt(document.getElementById(`p${side}-ev-atk`).value) || 0,
      def: parseInt(document.getElementById(`p${side}-ev-def`).value) || 0,
      spa: parseInt(document.getElementById(`p${side}-ev-spa`).value) || 0,
      spd: parseInt(document.getElementById(`p${side}-ev-spd`).value) || 0,
      spe: parseInt(document.getElementById(`p${side}-ev-spe`).value) || 0
    };

    let spdMult = getNatureMult(nature, "spd");
    // 沙暴天氣特防加成：岩石屬性特防 x1.5
    const isRockInSand = currentField.weather === "Sand" && pokeData.types.includes("岩石");

    const actual = {
      hp: calc50Stat("hp", pokeData.bs.hp, evs.hp, 1),
      atk: calc50Stat("atk", pokeData.bs.atk, evs.atk, getNatureMult(nature, "atk")),
      def: calc50Stat("def", pokeData.bs.def, evs.def, getNatureMult(nature, "def")),
      spa: calc50Stat("spa", pokeData.bs.spa, evs.spa, getNatureMult(nature, "spa")),
      spd: Math.floor(calc50Stat("spd", pokeData.bs.spd, evs.spd, spdMult) * (isRockInSand ? 1.5 : 1.0)),
      spe: calc50Stat("spe", pokeData.bs.spe, evs.spe, getNatureMult(nature, "spe"))
    };

    const tbody = document.querySelector(`#p${side}-bstable tbody`);
    tbody.innerHTML = "";

    const list = [
      { name: "ＨＰ", color: "bar-hp", base: pokeData.bs.hp, act: actual.hp },
      { name: "攻擊", color: "bar-atk", base: pokeData.bs.atk, act: actual.atk },
      { name: "防禦", color: "bar-def", base: pokeData.bs.def, act: actual.def },
      { name: "特攻", color: "bar-spa", base: pokeData.bs.spa, act: actual.spa },
      { name: "特防" + (isRockInSand ? " (沙暴x1.5)" : ""), color: "bar-spd", base: pokeData.bs.spd, act: actual.spd },
      { name: "速度", color: "bar-spe", base: pokeData.bs.spe, act: actual.spe }
    ];

    let total = 0;
    list.forEach(item => {
      total += item.base;
      const barPct = Math.min(100, (item.base / 200) * 100);
      tbody.innerHTML += `
        <tr>
          <td><strong>${item.name}</strong></td>
          <td>${item.base}</td>
          <td>
            <div class="bar-bg"><div class="bar-fill ${item.color}" style="width:${barPct}%"></div></div>
          </td>
          <td><strong>${item.act}</strong></td>
        </tr>
      `;
    });

    tbody.innerHTML += `<tr><td><strong>總和</strong></td><td><strong>${total}</strong></td><td colspan="2"></td></tr>`;
    return actual;
  }

  // 核心傷害運算與判定
  function calcNow() {
    const p1 = getCurrentStats(1);
    const p2 = getCurrentStats(2);

    const act1 = renderStats(1, p1);
    const act2 = renderStats(2, p2);

    // 取得選中的招式 slot
    const checkedRadio = document.querySelector('input[name="active-move"]:checked');
    const slotIdx = checkedRadio ? checkedRadio.value : "0";
    const moveIdx = parseInt(document.getElementById(`p1-move-${slotIdx}`).value) || 0;
    const move = p1.moves[moveIdx] || p1.moves[0];

    // 攻防能力計算
    let atk = move.cat === "physical" ? act1.atk : act1.spa;
    const p1Item = document.getElementById("p1-item").value;
    if (p1Item === "Choice Band" && move.cat === "physical") atk = Math.floor(atk * 1.5);
    if (p1Item === "Choice Specs" && move.cat === "special")  atk = Math.floor(atk * 1.5);
    if (p1Item === "Life Orb") atk = Math.floor(atk * 1.3);

    let def = move.cat === "physical" ? act2.def : act2.spd;
    const p2Item = document.getElementById("p2-item").value;
    if (p2Item === "Assault Vest" && move.cat === "special") def = Math.floor(def * 1.5);

    // 本系屬修 STAB
    let stab = p1.types.includes(move.type) ? 1.5 : 1.0;

    // 屬性相剋
    let typeMod = 1.0;
    p2.types.forEach(dt => {
      if (TYPE_CHART[move.type] && TYPE_CHART[move.type][dt] !== undefined) {
        typeMod *= TYPE_CHART[move.type][dt];
      }
    });

    // 天氣倍率
    let weatherMod = 1.0;
    if (currentField.weather === "Sun") {
      if (move.type === "火") weatherMod = 1.5;
      if (move.type === "水") weatherMod = 0.5;
    } else if (currentField.weather === "Rain") {
      if (move.type === "水") weatherMod = 1.5;
      if (move.type === "火") weatherMod = 0.5;
    }

    // 場地增傷倍率
    let terrainMod = 1.0;
    if (currentField.terrain === "Electric" && move.type === "電") terrainMod = 1.3;
    if (currentField.terrain === "Grassy") {
      if (move.type === "草") terrainMod = 1.3;
      if (move.name === "地震" || move.name === "重踏") terrainMod = 0.5;
    }
    if (currentField.terrain === "Psychic" && move.type === "超能力") terrainMod = 1.3;
    if (currentField.terrain === "Misty" && move.type === "龍") terrainMod = 0.5;

    // 雙打分散
    let spreadMod = (currentField.mode === "doubles" && move.spread) ? 0.75 : 1.0;

    // 標準傷害公式 (Lv 50)
    let hits = move.hits || 1;
    let baseDmg = Math.floor(
      (Math.floor((22 * move.bp * (atk / def)) / 50) + 2) *
      spreadMod * weatherMod * terrainMod * stab * typeMod
    );

    // 16 亂數浮動 [0.85 ~ 1.00]
    const rolls = [];
    for (let r = 85; r <= 100; r++) {
      rolls.push(Math.floor((baseDmg * r) / 100) * hits);
    }

    const minDmg = rolls[0];
    const maxDmg = rolls[rolls.length - 1];
    const targetHp = act2.hp;

    // 沙暴扣血 (1/16)
    const isSandDamage = currentField.weather === "Sand" && !p2.types.some(t => ["岩石", "地面", "鋼"].includes(t));
    const sandChip = isSandDamage ? Math.floor(targetHp / 16) : 0;

    const minPct = ((minDmg / targetHp) * 100).toFixed(1);
    const maxPct = ((maxDmg / targetHp) * 100).toFixed(1);

    // 確幾判定
    const koBadge = document.getElementById("ko-status");
    const killCount = rolls.filter(d => (d + sandChip) >= targetHp).length;

    if (typeMod === 0) {
      koBadge.className = "ko-badge ko-safe";
      koBadge.innerText = "🛡️ 沒有效果 (0% 傷害)";
    } else if (minDmg >= targetHp) {
      koBadge.className = "ko-badge ko-guaranteed";
      koBadge.innerText = "💥 確定 1 擊擊殺 (100% 確一)";
    } else if (minDmg + sandChip >= targetHp) {
      koBadge.className = "ko-badge ko-guaranteed";
      koBadge.innerText = `💥 確定 1 擊擊殺 (含沙暴回合結束扣除 ${sandChip} HP)`;
    } else if (killCount > 0) {
      const chance = ((killCount / 16) * 100).toFixed(1);
      koBadge.className = "ko-badge ko-chance";
      let sandText = sandChip > 0 ? " (已計入沙暴結束傷害)" : "";
      koBadge.innerText = `⚠️ 亂數 1 擊擊殺 (${chance}% 機率確一${sandText})`;
    } else if ((minDmg * 2 + sandChip * 2) >= targetHp) {
      koBadge.className = "ko-badge ko-guaranteed";
      koBadge.innerText = "⚔️ 確定 2 擊擊殺 (100% 確二)";
    } else {
      koBadge.className = "ko-badge ko-safe";
      koBadge.innerText = "🛡️ 安全耐受 (無法確二)";
    }

    let effText = typeMod >= 2 ? "效果絕佳！" : (typeMod < 1 && typeMod > 0 ? "效果不好。" : "");
    let stabText = stab > 1.0 ? "【本系屬性加成】" : "";

    document.getElementById("result-desc").innerText = 
      `${p1.name} 使用 ${move.name} ${stabText} vs. ${p2.name} ${effText}`;
    document.getElementById("result-nums").innerText = 
      `招式傷害：${minDmg} ~ ${maxDmg} (${minPct}% - ${maxPct}%)` + 
      (sandChip > 0 ? ` + 沙暴扣血 ${sandChip} HP (${((sandChip/targetHp)*100).toFixed(1)}%)` : "") +
      ` | 防守方實數 HP：${targetHp}`;
  }

  window.onload = init;
</script>
</body>
</html>
